version: '3.8'

services:
  # PostgreSQL - Compartilhado entre N8N e ChatApp
  postgres:
    image: postgres:15-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script para criar múltiplos databases
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - chatapp-network
    ports:
      - "5432:5432"  # Expor para debug (opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Compartilhado para N8N e sessões do ChatApp
  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - chatapp-network
    ports:
      - "6379:6379"  # Expor para debug (opcional)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N
  n8n:
    image: n8nio/n8n:latest
    container_name: chatapp-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Redis
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # N8N Config
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}

      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      TZ: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - chatapp-network
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ChatApp (Next.js) - Comentado por padrão para desenvolvimento
  # Descomente para rodar em produção com Docker
  # chatapp:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: chatapp-web
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     n8n:
  #       condition: service_healthy
  #   environment:
  #     # Node
  #     NODE_ENV: production
  #     PORT: 3000
  #
  #     # Database - ChatApp usa database separado
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${CHATAPP_DB_NAME:-chatapp}
  #
  #     # Redis para sessões
  #     REDIS_URL: redis://redis:6379
  #
  #     # JWT Secret
  #     JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
  #
  #     # URLs internas (Docker network)
  #     N8N_INTERNAL_URL: http://n8n:5678
  #
  #     # Auth Providers (opcional)
  #     GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  #     GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  #     MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  #     MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  #
  #     # LDAP (opcional)
  #     LDAP_ENABLED: ${LDAP_ENABLED:-false}
  #     LDAP_URL: ${LDAP_URL:-}
  #     LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  #
  #     # URL pública da aplicação
  #     NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
  #   volumes:
  #     - chatapp_uploads:/app/uploads
  #   networks:
  #     - chatapp-network
  #   ports:
  #     - "3000:3000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  chatapp_uploads:
    driver: local

networks:
  chatapp-network:
    driver: bridge
